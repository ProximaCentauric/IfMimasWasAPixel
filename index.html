<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>If Mimas Was a Pixel</title>
<meta name="description" content="A solar system scale model where Mimas, Saturn's moon, is a single pixel.">
<meta property="og:title" content="If Mimas Was a Pixel">
<meta property="og:description" content="Scroll the solar system, and the gulf to the next star, at true scale, with Mimas as one pixel.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<style>
  :root {
    --space: #05070d;
    --ink: #e9e6dc;
    --dim: #8b90a0;
    --rule: rgba(233, 230, 220, .22);
    --panel: rgba(5, 7, 13, .86);
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--space); color: var(--ink); font-family: var(--serif);
  }

  /* The world: a fixed stage that a virtual camera slides across */
  #stage {
    position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
    background-image:
      radial-gradient(1px 1px at 37px 61px,   rgba(255,255,255,.9), transparent),
      radial-gradient(1px 1px at 190px 140px, rgba(255,255,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 310px 250px, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 520px 90px,  rgba(255,255,255,.5), transparent);
    background-size: 413px 311px, 577px 389px, 701px 463px, 853px 521px;
  }
  #stage.dragging { cursor: grabbing; }

  /* Regions (belts, heliosheath, Oort cloud, Planet Nine zone) */
  .region { position: absolute; top: 0; bottom: 0; display: none; pointer-events: none; }
  .region span {
    position: absolute; left: 12px; bottom: 150px; white-space: nowrap;
    font-size: .8rem; color: var(--dim);
  }

  /* Bodies */
  .body { position: absolute; top: 50%; border-radius: 50%; transform: translate(-50%, -50%); }
  .halo {
    position: absolute; top: 50%; width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--rule); transform: translate(-50%, -50%);
  }
  .halo.sub { border-style: dashed; border-color: rgba(255, 179, 71, .55); }      /* dashed = smaller than 1 pixel */
  .halo.ghost { width: 34px; height: 34px; border-style: dotted; border-color: rgba(190, 160, 255, .75); }  /* dotted = never found */
  .tag {
    position: absolute; transform: translate(-50%, -100%);
    text-align: center; white-space: nowrap; line-height: 1.3; pointer-events: none;
  }
  .tag.below { transform: translate(-50%, 0); }
  .tag b { display: block; font-size: 1.05rem; font-weight: 600; }
  .tag span { font-size: .8rem; color: var(--dim); }
  .tag.on-sun { transform: translate(-50%, -50%); color: var(--inside-ink, #3b1c00); }
  .tag.on-sun span { color: var(--inside-ink-dim, #5a2d00); }
  .stem { display: block; width: 1px; height: 18px; background: var(--rule); margin: 4px auto 0; }
  .tag.below .stem { margin: 0 auto 4px; }

  /* Ruler */
  .tick { position: absolute; bottom: 96px; width: 1px; height: 22px; background: var(--rule); }
  .tick i {
    position: absolute; bottom: 26px; left: 0; transform: translateX(-50%);
    font-style: normal; font-size: .75rem; color: var(--dim); white-space: nowrap;
  }
  .tick.light { background: rgba(255, 179, 71, .6); }
  .tick.light i { color: #ffb347; }

  /* Controls */
  #top, #hud {
    position: fixed; left: 0; right: 0; z-index: 5;
    background: var(--panel); backdrop-filter: blur(6px);
    padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
  }
  #top { top: 0; border-bottom: 1px solid var(--rule); }
  #top strong { font-size: 1.05rem; margin-right: 6px; }
  #hud { bottom: 0; border-top: 1px solid var(--rule); }
  button, select {
    font: inherit; font-size: .9rem; color: var(--ink);
    background: transparent; border: 1px solid var(--rule); border-radius: 6px; padding: 4px 10px;
    cursor: pointer;
  }
  select option, select optgroup { background: #0d111c; color: var(--ink); }
  button:hover, select:hover { border-color: var(--ink); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #ffb347; outline-offset: 2px; }
  button[aria-pressed="true"] { background: #ffb347; border-color: #ffb347; color: #1a0f00; }
  #readout { font-variant-numeric: tabular-nums; font-size: .95rem; }
  #readout em { color: var(--dim); font-style: normal; }
  #hint, #legend { color: var(--dim); font-size: .85rem; }
  #scrub { flex: 1 1 160px; min-width: 120px; accent-color: #ffb347; }
  #controls { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
  /* Magnetospheres: one screen-sized overlay, redrawn as the camera moves */
  #magneto { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
  .tailend { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed rgba(95, 212, 196, .55); pointer-events: none; }
  body.mag-off #magneto, body.mag-off .maglabel { display: none !important; }
  #center-mark {
    position: fixed; left: 50%; top: 0; bottom: 0; width: 1px; z-index: 1;
    background: linear-gradient(transparent 40%, rgba(255,179,71,.35) 50%, transparent 60%);
    pointer-events: none;
  }
</style>
</head>
<body>

<nav id="top" aria-label="Jump to a body"><strong>If Mimas Was a Pixel</strong></nav>
<div id="stage" aria-label="Solar system to scale. Drag, scroll or use the arrow keys."></div>
<div id="center-mark"></div>

<div id="hud">
  <div id="readout" aria-live="off"></div>
  <input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="Position in the solar system (linear)">
  <select id="range" aria-label="Distance the slider covers">
    <option value="3">Slider: out to 3 AU</option>
    <option value="30">Slider: out to 30 AU (Neptune)</option>
    <option value="600" selected>Slider: out to 600 AU (Sedna)</option>
    <option value="all">Slider: all the way to Alpha Centauri</option>
  </select>
  <div id="controls">
    <span id="legend">Dashed ring: under 1 pixel. Dotted purple: never found. Teal: magnetopause. Blue dashes: bow shock.</span>
    <label for="speed" id="hint">Scroll speed</label>
    <select id="speed">
      <option value="1">x1</option>
      <option value="10">x10</option>
      <option value="100" selected>x100</option>
      <option value="1000">x1,000</option>
      <option value="10000">x10,000</option>
      <option value="100000">x100,000</option>
      <option value="1000000">x1,000,000</option>
      <option value="10000000">x10,000,000</option>
      <option value="100000000">x100,000,000</option>
    </select>
    <button id="magneto-toggle" aria-pressed="true" title="Show or hide the magnetospheres">Magnetospheres</button>
    <button id="photon" aria-pressed="false">Ride a beam of light</button>
  </div>
</div>

<script>
/* ---------- Scale: Mimas (396.4 km wide) = 1 pixel ---------- */
const KM_PER_PX = 396.4;
/* ------------------------------------------------------------ */

const AU_KM = 149597870.7;
const C_KM_S = 299792.458;              // speed of light
const LY_AU = 63241.077;                // light-year in AU
const LIGHT_PX_PER_S = C_KM_S / KM_PER_PX;
const fmt = n => Math.round(n).toLocaleString("en-US");

// Planets: d = diameter (km), a = mean distance from the Sun (km)
const PLANETS = [
  { name: "Sun",     d: 1392684, a: 0,       fill: "radial-gradient(circle at 38% 38%, #fff4b8, #ffb300 55%, #ff7a00)", glow: true,
    note: "G2V star, 1,392,684 km across" },
  { name: "Mercury", d: 4879,    a: 57.9e6,  fill: "#9d9890" },
  { name: "Venus",   d: 12104,   a: 108.2e6, fill: "#e3c27a" },
  { name: "Earth",   d: 12742,   a: 149.6e6, fill: "radial-gradient(circle at 35% 35%, #7fb8ff, #1f5fb4)" },
  { name: "Mars",    d: 6779,    a: 227.9e6, fill: "#c1623c" },
  { name: "Jupiter", d: 139820,  a: 778.5e6, fill: "linear-gradient(#d9b48f, #b98a62 30%, #e3c9a6 55%, #a87a55)" },
  { name: "Saturn",  d: 116460,  a: 1432e6,  fill: "linear-gradient(#e6d3a0, #cdb27a 50%, #e8d9b0)" },
  { name: "Uranus",  d: 50724,   a: 2867e6,  fill: "#9fd8dc" },
  { name: "Neptune", d: 49244,   a: 4515e6,  fill: "#4b6fe0" }
];

// Saturn's rings: r0 and r1 are the inner and outer edges, in km from Saturn's centre
const RING_TILT_DEG = 26.7;             // Saturn's axial tilt; drawn this way so the bands show (0 hides the rings)
const SATURN_RINGS = [
  { name: "D ring", r0: 66900,  r1: 74510,  fill: "rgba(200,180,150,.14)" },
  { name: "C ring", r0: 74658,  r1: 92000,  fill: "rgba(140,120,100,.38)" },
  { name: "B ring", r0: 92000,  r1: 117580, fill: "rgba(232,208,165,.88)" },
  // Cassini Division: 117,580 to 122,170 km is left empty on purpose
  { name: "A ring", r0: 122170, r1: 136775, fill: "rgba(214,190,150,.72)" },
  { name: "F ring", r0: 140080, r1: 140300, fill: "rgba(235,220,195,.9)" },
  { name: "G ring", r0: 166000, r1: 175000, fill: "rgba(200,190,170,.12)" },
  { name: "E ring", r0: 180000, r1: 480000, fill: "rgba(190,200,240,.05)" }
];

// Uranus's rings: radii in km from the planet's centre (widths are approximate for the narrow rings).
// Uranus is tipped 97.8 degrees, so its ring plane stands almost upright against the orbit. Like Saturn's,
// the tilt below is chosen so the bands show (0 would hide them), and the rings are drawn as tall ellipses.
// Rings narrower than half a pixel are drawn as thin lines, so they are far wider on screen than in reality.
const URANUS_RING_OPEN_DEG = 30;
const URANUS_RINGS = [
  { name: "ζ ring", r0: 37850, r1: 41350, fill: "rgba(150,160,175,.10)" },   // faint dust
  { name: "6 ring", r0: 41836, r1: 41838, fill: "rgba(185,195,205,.55)" },
  { name: "5 ring", r0: 42232, r1: 42236, fill: "rgba(185,195,205,.55)" },
  { name: "4 ring", r0: 42568, r1: 42572, fill: "rgba(185,195,205,.55)" },
  { name: "α ring", r0: 44714, r1: 44722, fill: "rgba(195,205,215,.65)" },
  { name: "β ring", r0: 45657, r1: 45665, fill: "rgba(195,205,215,.65)" },
  { name: "η ring", r0: 47174, r1: 47176, fill: "rgba(185,195,205,.55)" },
  { name: "γ ring", r0: 47625, r1: 47629, fill: "rgba(185,195,205,.60)" },
  { name: "δ ring", r0: 48298, r1: 48303, fill: "rgba(185,195,205,.60)" },
  { name: "λ ring", r0: 50023, r1: 50025, fill: "rgba(185,195,205,.50)" },
  { name: "ε ring", r0: 51120, r1: 51178, fill: "rgba(220,228,238,.85)" },   // the bright one, about 58 km wide
  { name: "ν ring", r0: 66100, r1: 69900, fill: "rgba(210,120,100,.10)" },   // faint, reddish dust
  { name: "μ ring", r0: 86000, r1: 103000, fill: "rgba(110,140,230,.10)" }   // faint, bluish dust
];

// Neptune's Adams ring (62,933 km, about 15 km wide) and the five bright arcs embedded in it.
// Arc angles are in degrees round the ring, measured from the line of nodes: start and end of each arc.
// Lengths and gaps follow published separations (Fraternité about 10 degrees long, the others 1 to 4 degrees,
// all five within about 40 degrees). Where the real arcs sit round the ring is arbitrary here, and the real
// ones have drifted and faded since Voyager 2 (Courage and Liberté were gone by 2009), so treat them as approximate.
const NEPTUNE_RING_OPEN_DEG = 28.3;
const NEPTUNE_RINGS = [
  { name: "Adams ring",   r0: 62925, r1: 62940, fill: "rgba(170,190,235,.25)" },
  { name: "Fraternité",   r0: 62925, r1: 62940, fill: "rgba(205,220,255,.95)", arc: [20, 30],       w: 1.4 },
  { name: "Égalité 1",    r0: 62925, r1: 62940, fill: "rgba(205,220,255,.85)", arc: [31.75, 34.25], w: 1.4 },
  { name: "Égalité 2",    r0: 62925, r1: 62940, fill: "rgba(205,220,255,.85)", arc: [34.2, 37.2],   w: 1.4 },
  { name: "Liberté",      r0: 62925, r1: 62940, fill: "rgba(205,220,255,.85)", arc: [43, 47],       w: 1.4 },
  { name: "Courage",      r0: 62925, r1: 62940, fill: "rgba(205,220,255,.70)", arc: [50.95, 53.65], w: 1.4 }
];

// Rings that are thick compared with their width, drawn edge-on as slabs (radii and thickness in km).
// Jupiter's axis is tipped only 3 degrees, and the Phoebe ring lies near the plane of the planets' orbits,
// so both really are seen close to edge-on from the side. profile "edges": brighter at top and bottom
// (the gossamer rings are brightest at their edges), "mid": brightest in the middle.
const EDGE_ON_RINGS = {
  Saturn: {
    rgb: "205,175,145",
    slabs: [
      { r0: 6000000, r1: 18000000, thick: 2400000, a: .05, profile: "mid" },
      { r0: 8500000, r1: 14000000, thick: 1500000, a: .05, profile: "mid" }
    ],
    title: "Phoebe ring", labelKm: 9000000,
    label: ["Bulk of it runs from about 6 to 18 million km out",
            "About 2.4 million km thick: 6,000 pixels",
            "Drawn edge-on, tilted 27° from the main rings"]
  },
  Jupiter: {
    rgb: "205,160,120",
    slabs: [
      { r0: 129000, r1: 226000, thick: 8400, a: .07, profile: "edges" },   // Thebe gossamer ring
      { r0: 129000, r1: 182000, thick: 2300, a: .16, profile: "edges" }    // Amalthea gossamer ring
    ],
    title: "Jupiter's gossamer rings", labelKm: 0,
    label: ["Amalthea ring: 129,000 to 182,000 km, 2,300 km thick",
            "Thebe ring: 129,000 to 226,000 km, 8,400 km thick",
            "Drawn edge-on: Jupiter's tilt is only 3°"]
  }
};

// Asteroids, dwarf planets and other small bodies, sorted by distance
// au = semi-major axis (AU), est = size is an estimate
const TNO = "Trans-Neptunian object";
const SMALL = [
  { name: "Apophis",    au: 0.922, d: 0.37,  kind: "Asteroid", fill: "#515155" },
  { name: "Bennu",    au: 1.126, d: 0.53,  kind: "Asteroid", fill: "#7a7570" },
  { name: "Eros",    au: 1.458, d: 16.84,  kind: "Asteroid", fill: "#bfa37a" },
  { name: "Didymos",    au: 1.644, d: 0.85,  kind: "Asteroid", fill: "#515155" },
  { name: "Vesta",    au: 2.362, d: 525.4, kind: "Asteroid", fill: "#b9b2a6" },
  { name: "Eunomia",    au: 2.642, d: 340, kind: "Asteroid", fill: "#d5d1cf" },
  { name: "Juno",     au: 2.669, d: 233.9, kind: "Asteroid", fill: "#9c948c" },
  { name: "Ceres",   au: 2.767, d: 966,   kind: "Dwarf planet", fill: "#5c5956" },
  { name: "Pallas",   au: 2.771, d: 512,   kind: "Asteroid", fill: "#8f8a85" },
  { name: "Ida",   au: 2.861, d: 15.7,   kind: "Asteroid", fill: "#74787d" },
  { name: "Psyche",   au: 2.92,  d: 226,   kind: "Asteroid", fill: "#a29b94" },
  { name: "Europa (asteroid)", au: 3.09, d: 315, kind: "Asteroid", fill: "#6f6a66" },
  { name: "Hygiea",   au: 3.142, d: 434,   kind: "Asteroid", fill: "#6f6a66" },
  { name: "Chariklo", au: 15.8,  d: 250,   kind: "Centaur", est: true, fill: "#8a6f60" },
  { name: "Orcus",    au: 39.17, d: 910,   kind: TNO, est: true, fill: "#8c8a8f" },
  { name: "Pluto",    au: 39.48, d: 2376.6, kind: "Dwarf planet", fill: "#c9b49a" },
  { name: "Ixion",    au: 39.7,  d: 650,   kind: TNO, est: true, fill: "#8a5a4a" },
  { name: "Máni",    au: 41.74,  d: 824,   kind: TNO, est: true, fill: "#307261" },
  { name: "Salacia",  au: 42.18,  d: 846,   kind: TNO, est: true, fill: "#6f6a70" },
  { name: "2005 UQ213",  au: 42.213,  d: 498,   kind: TNO, est: true, fill: "#7b221c" },
  { name: "Varuna",   au: 42.8,  d: 668,   kind: TNO, est: true, fill: "#8f6b55" },
  { name: "Haumea",   au: 43.12, d: 1632,  kind: "Dwarf planet", fill: "#d8dde6" },
  { name: "Quaoar",   au: 43.69, d: 1110,  kind: TNO, fill: "#a0522d" },
  { name: "Makemake", au: 45.51, d: 1430,  kind: "Dwarf planet", fill: "#c58a6a" },
  { name: "Gonggong", au: 67.49, d: 1230,  kind: TNO, est: true, fill: "#a85a4a" },
  { name: "Eris",     au: 67.86, d: 2326,  kind: "Dwarf planet", fill: "#e9e9ee" },
  { name: "Gǃkúnǁʼhòmdímà", au: 74, d: 640, kind: TNO, est: true, fill: "#8a5a50" },
  { name: "Farout", au: 123, d: 640, kind: TNO, est: true, fill: "#8a5a50" },
  { name: "Farfarout", au: 132.2, d: 400, kind: TNO, est: true, fill: "#8a5a50" },
  { name: "Sedna",    au: 506,   d: 995,   kind: TNO, est: true, fill: "#b5442e",
    note: "506 AU on average, ranging from 76 to 937 AU" }
];

// Objects that were proposed but never found (or were ruled out), shown where people thought they'd be.
// They have no body, only a dotted ring, because nobody knows their size.
const HYPO = [
  { name: "Vulcan",      au: 0.14,   kind: "Hypothetical planet, ruled out",
    note: "Proposed in 1859, about 0.14 AU from the Sun",
    extra: "Mercury's odd orbit turned out to be general relativity" },
  { name: "Planet X",    au: 43,     kind: "Hypothetical planet, ruled out",
    note: "Lowell predicted it in 1915, at about 43 AU",
    extra: "Pluto turned up in 1930, but it is far too small" },
  { name: "Planet Nine", au: 600,    kind: "Hypothetical planet, still searched for",
    note: "Proposed in 2016, estimates range from 400 to 800 AU",
    extra: "Would be about 5 to 10 Earth masses" },
  { name: "Tyche",       au: 15000,  kind: "Hypothetical gas giant, not found",
    note: "Proposed in 1999, about 15,000 AU out",
    extra: "NASA's WISE survey found no sign of it" },
  { name: "Nemesis",     au: 95000,  kind: "Hypothetical companion star, not found",
    note: "Proposed in 1984, about 1.5 light-years out",
    extra: "Meant to explain a 26-million-year extinction cycle" }
];

// The far reaches: spacecraft and the nearest stars
// Spacecraft positions are estimates from a reference date and speed, so the page updates itself when it loads.
// To recalibrate, change the AU figure and the date from NASA's mission status pages.
const yearsSince = iso => (Date.now() - Date.parse(iso)) / 31557600000;
const v1au  = 172.1 + 3.57 * yearsSince("2026-10-14");   // Voyager 1, ~3.57 AU per year
const v2au  = 145.5 + 3.25 * yearsSince("2026-10-14");   // Voyager 2, ~3.25 AU per year (rougher estimate)
const p10au = 102.9 + 2.55 * yearsSince("2011-05-06");   // Pioneer 10, last tracked in 2003, so this is extrapolated
const p11au = 82.9  + 2.45 * yearsSince("2011-05-06");   // Pioneer 11, last tracked in 1995, so this is extrapolated
const nhau  = 64.45 + 2.89 * yearsSince("2026-04-15");   // New Horizons, ~2.89 AU per year
const alphaCenA = 4.344 * LY_AU * AU_KM;                  // Alpha Centauri A, in km from the Sun

const FAR = [
  { name: "New Horizons", a: nhau * AU_KM, d: 0.0021, kind: "Spacecraft", fill: "#9fd8ff",
    note: `About ${Math.round(nhau)} AU out, gaining 2.9 AU a year`,
    extra: "Flew past Pluto in 2015, still operating" },
  { name: "Pioneer 11", a: p11au * AU_KM, d: 0.00274, kind: "Spacecraft", fill: "#c9b08a", lane: -1,
    note: `About ${Math.round(p11au)} AU out, gaining 2.4 AU a year`,
    extra: "Last signal received in 1995" },
  { name: "Pioneer 10", a: p10au * AU_KM, d: 0.00274, kind: "Spacecraft", fill: "#c9b08a",
    note: `About ${Math.round(p10au)} AU out, gaining 2.5 AU a year`,
    extra: "Last signal received in 2003" },
  { name: "Voyager 2", a: v2au * AU_KM, d: 0.00366, kind: "Spacecraft", fill: "#ffb347", lane: -1,
    note: `About ${Math.round(v2au)} AU out, gaining 3.3 AU a year`,
    extra: "Left the heliosphere in 2018" },
  { name: "Voyager 1", a: v1au * AU_KM, d: 0.00366, kind: "Spacecraft", fill: "#ffb347",
    note: `About ${Math.round(v1au)} AU out, gaining 3.6 AU a year`,
    extra: "Left the heliosphere in 2012" },
  { name: "Proxima Centauri", a: 4.2465 * LY_AU * AU_KM, d: 214750, kind: "Red dwarf, M5.5Ve", glow: true,
    fill: "radial-gradient(circle at 38% 38%, #ff9a6a, #e8431f 60%, #a82a10)", ink: "#2a0d00", inkDim: "#4a1a08",
    note: "4.25 light-years from the Sun" },
  { name: "Alpha Centauri A", a: alphaCenA, d: 1703800, kind: "G2V star", glow: true,
    fill: "radial-gradient(circle at 38% 38%, #fffbe0, #ffe27a 55%, #ffc13a)",
    note: "4.34 light-years from the Sun" },
  { name: "Alpha Centauri B", a: alphaCenA + 23.4 * AU_KM, d: 1202200, kind: "K1V star", glow: true,
    fill: "radial-gradient(circle at 38% 38%, #ffe0b0, #ffa94a 60%, #e6792a)",
    note: "About 23 AU from Alpha Centauri A" }
];

// Moons: orbit = mean distance from the parent (km), grouped by parent and sorted by distance
// lane: 1 = label above, 2 = higher above, -1 = label below, -2 = lower below (keeps crowded labels apart)
const MOONS = [
  { name: "Moon",      parent: "Earth",   d: 3474.8, orbit: 384400,   fill: "#b8b5ad", lane: 1 },

/* ---------- Magnetospheres ----------
   Sizes are in planet radii, measured sunward along the Sun-planet line (the "nose"):
   mp = magnetopause (where the planet's field holds off the solar wind), bs = bow shock,
   range = how far the magnetopause swings with solar-wind pressure. The shape is one generic Shue-type curve,
   r = r0 / sin(d/2)^(2 alpha) with alpha 0.6 (0.5 for Mercury, as MESSENGER measured), scaled to each planet, so the flanks and tail are schematic: the real ones are lumpier,
   and Uranus's and Neptune's tilted fields twist their tails. tailKm is how far the shape is drawn
   before it fades out. The Sun is to the left, so the nose points left and the tail trails off to the right. */
const MAGNETOSPHERES = {
  Mercury: { rKm: 2439.7, mp: 1.45, bs: 1.96, range: [1.35, 1.55], alpha: 0.5, tailKm: 100 * 2439.7,
             tail: "Tail length is poorly known: 10 to 100 radii",
             endTitle: "Where Mercury's magnetotail is drawn to",
             end: "Its real end is uncertain: somewhere between 10 and 100 radii",
             extra: "In big solar storms it is pressed right down to the surface" },
  Earth:   { rKm: 6378,  mp: 10,   bs: 14,   range: [6, 15],   tailKm: 200 * 6378,
             tail: "Tail runs at least 200 radii, well past the Moon",
             end: "The tail has been traced at least this far" },
  Jupiter: { rKm: 71492, mp: 75,   bs: 100,  range: [50, 100], tailKm: 6 * AU_KM,
             tail: "Tail stretches over 6 AU, past Saturn's orbit",
             end: "At least 6 AU long: well past Saturn's orbit" },
  Saturn:  { rKm: 60268, mp: 19,   bs: 26,   range: [16, 22],  tailKm: 87 * 60268,
             tail: "Voyager 2 last crossed the shock 87 radii downstream",
             end: "Voyager 2 last crossed the shock about here; the tail may run farther" },
  Uranus:  { rKm: 25559, mp: 18,   bs: 23.7,                    tailKm: 227.7 * 25559,
             tail: "Voyager 2 last crossed the shock 228 radii downstream",
             end: "Voyager 2 last crossed the shock about here; the tail may run farther",
             extra: "Field tipped 60° off the spin axis: the real tail twists round every 17 hours" },
  Neptune: { rKm: 24764, mp: 24.5, bs: 34.9, range: [23, 26],  tailKm: 161.1 * 24764,
             tail: "Voyager 2 last crossed the shock 161 radii downstream",
             end: "Voyager 2 last crossed the shock about here; the tail may run farther",
             extra: "Field tipped 47° off the spin axis, so the shock moves as it spins" }
};
const fmtKm = km => km >= 1e6 ? `${(km / 1e6).toFixed(1)} million km` : `${fmt(km)} km`;

/* Boundary curve for a given nose distance: points (X, Y) in px, X running from the nose (negative = sunward) down the tail */
function shueCurve(noseKm, tailKm, alpha = 0.6) {
  const X = [], Y = [];
  for (let d = Math.PI; d > 1e-7; d *= 0.985) {
    const r = noseKm / Math.pow(Math.sin(d / 2), 2 * alpha);
    X.push(px(r * Math.cos(d))); Y.push(px(r * Math.sin(d)));
    if (r * Math.cos(d) >= tailKm) break;
  }
  return { X, Y };
}

const SVGNS = "http://www.w3.org/2000/svg";
const magSvg = document.createElementNS(SVGNS, "svg");
magSvg.id = "magneto";
stage.appendChild(magSvg);                // after the regions, before everything else, so it sits behind the bodies
let magnetoOn = true;
const MAG = Object.entries(MAGNETOSPHERES).map(([name, m]) => {
  const b = BODIES.find(q => q.name === name);
  const o = { ...m, name, x: xOf(b), mpKm: m.mp * m.rKm, bsKm: m.bs * m.rKm };
  o.L = px(m.tailKm);
  o.mpC = shueCurve(o.mpKm, m.tailKm, m.alpha);
  o.bsC = shueCurve(o.bsKm, m.tailKm, m.alpha);
  magSvg.insertAdjacentHTML("beforeend",
    `<g id="mg-${name}" style="display:none">` +
      `<defs><linearGradient id="mgrad-${name}" gradientUnits="userSpaceOnUse" y1="0" y2="0">` +
        `<stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>` +
      `<mask id="mmask-${name}" maskUnits="userSpaceOnUse" x="0" y="0"><rect x="0" y="0" fill="url(#mgrad-${name})"/></mask></defs>` +
      `<g mask="url(#mmask-${name})">` +
        `<path class="bs" fill="rgba(111,182,255,.05)" stroke="rgba(111,182,255,.6)" stroke-width="1.2" stroke-dasharray="8 6"/>` +
        `<path class="mp" fill="rgba(95,212,196,.07)" stroke="rgba(95,212,196,.8)" stroke-width="1.5"/>` +
      `</g></g>`);
  o.g = magSvg.querySelector(`#mg-${name}`);
  o.grad = magSvg.querySelector(`#mgrad-${name}`);
  o.mask = magSvg.querySelector(`#mmask-${name}`);
  o.maskRect = o.mask.firstElementChild;
  o.bsPath = o.g.querySelector(".bs");
  o.mpPath = o.g.querySelector(".mp");
  return o;
});

/* Only the slice of each curve that is on screen is drawn, so a 6 AU tail costs no more than a small one */
function slicePath(c, cx, cy, vw, vh) {
  const n = c.X.length;
  let i0 = 0, i1 = n - 1;
  for (let i = 0; i < n; i++) { if (cx + c.X[i] <= 0) i0 = i; else break; }
  for (let i = n - 1; i >= 0; i--) { if (cx + c.X[i] >= vw) i1 = i; else break; }
  let up = "", lo = "";
  for (let i = i0; i <= i1; i++) {
    const sx = (cx + c.X[i]).toFixed(1), y = Math.min(c.Y[i], vh);
    up += `${i === i0 ? "M" : "L"}${sx} ${(cy - y).toFixed(1)}`;
    lo = `L${sx} ${(cy + y).toFixed(1)}` + lo;
  }
  return up + lo + "Z";
}
function drawMagnetospheres(vw, vh) {
  if (!magnetoOn) return;
  const cy = vh / 2;
  for (const m of MAG) {
    const cx = m.x - camLeft;
    if (cx + m.L < -50 || cx + m.bsC.X[0] > vw + 50) { m.g.style.display = "none"; continue; }
    m.g.style.display = "";
    m.bsPath.setAttribute("d", slicePath(m.bsC, cx, cy, vw, vh));
    m.mpPath.setAttribute("d", slicePath(m.mpC, cx, cy, vw, vh));
    m.grad.setAttribute("x1", cx + m.L * 0.4);
    m.grad.setAttribute("x2", cx + m.L);
    m.mask.setAttribute("width", vw); m.mask.setAttribute("height", vh);
    m.maskRect.setAttribute("width", vw); m.maskRect.setAttribute("height", vh);
  }
}
document.getElementById("magneto-toggle").addEventListener("click", e => {
  magnetoOn = !magnetoOn;
  e.currentTarget.setAttribute("aria-pressed", String(magnetoOn));
  document.body.classList.toggle("mag-off", !magnetoOn);
  dirty = true;
});

/* Ring systems: seen at an angle, so each band is an ellipse. The far half is drawn behind the planet, the near half in front.
   rot turns the whole ring (Uranus's rings stand on end). */
const RING_SYSTEMS = {
  Saturn: {
    rings: SATURN_RINGS, outer: 480000, tilt: RING_TILT_DEG, rot: 0,
    label: ["Main rings reach 136,775 km from the centre",
            "Faint E ring reaches about 480,000 km",
            "Typically about 10 m thick: 1/40,000 of a pixel"]
  },
  Neptune: {
    rings: NEPTUNE_RINGS, outer: 63000, tilt: NEPTUNE_RING_OPEN_DEG, rot: 0,
    title: "Neptune's ring arcs",
    label: ["Five bright arcs in the Adams ring, 62,933 km out",
            "Each arc is 1° to 10° long and about 15 km wide",
            "All five sit within about 40° of the ring"]
  },
  Uranus: {
    rings: URANUS_RINGS, outer: 103000, tilt: URANUS_RING_OPEN_DEG, rot: 90,
    label: ["13 known rings, out to about 103,000 km",
            "Nine narrow rings, each 1/200 to 1/7 of a pixel wide",
            "Tipped on its side, so the rings stand on end"]
  }
};
Object.entries(RING_SYSTEMS).forEach(([name, s]) => {
  s.name = name;
  s.sin = Math.sin(s.tilt * Math.PI / 180);
  s.on = s.sin > 0.01;
  s.R = px(s.outer);                    // outer edge, in px
  s.hw = s.R + 100;
});

Object.entries(EDGE_ON_RINGS).forEach(([name, e]) => {
  e.name = name;
  e.R = px(Math.max(...e.slabs.map(t => t.r1)));
  e.H = px(Math.max(...e.slabs.map(t => t.thick)));
  e.hw = e.R + 100;
});

function edgeOnLayer(e) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `${-e.R} ${-e.H / 2} ${2 * e.R} ${e.H}`);
  svg.setAttribute("width", 2 * e.R);
  svg.setAttribute("height", e.H);
  svg.style.cssText = "position:absolute; top:50%; transform:translate(-50%,-50%); overflow:visible; pointer-events:none;";
  let defs = "", rects = "";
  e.slabs.forEach((t, n) => {
    const id = `edge-${e.name}-${n}`;
    const lo = t.profile === "edges" ? t.a : 0, hi = t.profile === "edges" ? t.a * 0.3 : t.a;
    defs += `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">` +
      `<stop offset="0" stop-color="rgb(${e.rgb})" stop-opacity="${lo}"/>` +
      `<stop offset=".5" stop-color="rgb(${e.rgb})" stop-opacity="${hi}"/>` +
      `<stop offset="1" stop-color="rgb(${e.rgb})" stop-opacity="${lo}"/></linearGradient>`;
    const a = px(t.r0), b = px(t.r1), h = px(t.thick);
    [-b, a].forEach(x0 => { rects += `<rect x="${x0}" y="${-h / 2}" width="${b - a}" height="${h}" fill="url(#${id})"/>`; });
  });
  svg.innerHTML = `<defs>${defs}</defs>${rects}`;
  return svg;
}

function ringTag(title, lines, top) {
  const rt = document.createElement("div");
  rt.className = "tag below";
  rt.style.top = top;
  rt.innerHTML = `<i class="stem"></i><b>${title}</b>` +
    lines.map((t, n) => `<span>${n ? "<br>" : ""}${t}</span>`).join("");
  return rt;
}

function ringLayer(s, half) {
  const R = s.R, H = R * s.sin;
  const ell = (rx, ry) => `M ${-rx} 0 A ${rx} ${ry} 0 1 0 ${rx} 0 A ${rx} ${ry} 0 1 0 ${-rx} 0 Z`;
  const bands = s.rings.map(r => {
    const o = px(r.r1), i = px(r.r0);
    if (r.arc) {                        // a partial ring: draw just the arc, as a line
      const m = (o + i) / 2, ry = m * s.sin;
      const pt = d => { const t = d * Math.PI / 180; return `${m * Math.cos(t)} ${ry * Math.sin(t)}`; };
      return `<path d="M ${pt(r.arc[0])} A ${m} ${ry} 0 0 1 ${pt(r.arc[1])}" fill="none" stroke="${r.fill}" stroke-width="${r.w || 1.2}" stroke-linecap="round"/>`;
    }
    if (o - i < 0.5) {                  // under half a pixel: draw a hairline instead of a band
      const m = (o + i) / 2;
      return `<ellipse rx="${m}" ry="${m * s.sin}" fill="none" stroke="${r.fill}" stroke-width="0.6"/>`;
    }
    return `<path fill="${r.fill}" fill-rule="evenodd" d="${ell(o, o * s.sin)} ${ell(i, i * s.sin)}"/>`;
  }).join("");
  const y = half === "back" ? -H - 2 : 0;
  const id = `ring-${s.name}-${half}`;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `${-R} ${-H} ${2 * R} ${2 * H}`);
  svg.setAttribute("width", 2 * R);
  svg.setAttribute("height", 2 * H);
  svg.style.cssText = "position:absolute; top:50%; transform:translate(-50%,-50%) rotate(" + s.rot + "deg); overflow:visible; pointer-events:none;";
  svg.innerHTML =
    `<defs><clipPath id="${id}"><rect x="${-R}" y="${y}" width="${2 * R}" height="${H + 2}"/></clipPath></defs>` +
    `<g clip-path="url(#${id})">${bands}</g>`;
  return svg;
}

/* Jump menus */
function makeMenu(label) {
  const s = document.createElement("select");
  s.setAttribute("aria-label", label);
  s.innerHTML = `<option value="">${label}</option>`;
  s.onchange = () => { if (s.value) goTo(Number(s.value)); s.value = ""; };
  return s;
}
const moonMenu = makeMenu("Jump to a moon");
const smallMenu = makeMenu("Jump to an asteroid or dwarf planet");
const hypoMenu = makeMenu("Jump to a hypothetical object");
const farMenu = makeMenu("Jump to the far reaches");
const groups = {};
const farOptions = [];

/* Build bodies, labels, jump controls */
BODIES.forEach(b => {
  const x = xOf(b), size = px(b.d);

  if (size < 20) {                       // tiny bodies, and objects never found, get a ring so you can spot them
    const h = document.createElement("div");
    h.className = "halo" + (b.ghost ? " ghost" : size < 1 ? " sub" : "");
    add(h, x, 60);
  }

  const rs = RING_SYSTEMS[b.name];
  const eo = EDGE_ON_RINGS[b.name];
  if (eo) add(edgeOnLayer(eo), x, eo.hw);
  if (rs && rs.on) add(ringLayer(rs, "back"), x, rs.hw);

  if (!b.ghost) {
    const el = document.createElement("div");
    el.className = "body";
    el.style.cssText = `width:${size}px; height:${size}px; background:${b.fill};`;
    if (b.glow) el.style.boxShadow = "0 0 120px 30px rgba(255,160,40,.35)";
    add(el, x, size / 2 + 150);
  }

  if (rs && rs.on) add(ringLayer(rs, "front"), x, rs.hw);

  /* Label: big bodies (the Sun, nearby stars) get it centred inside */
  const inside = size > 500;
  const lane = b.lane || 1;
  const below = lane < 0;
  const reach = b.ghost ? 20 : size < 20 ? 15 : size / 2;  // clear the body (or its ring)
  const offset = reach + 14 + (Math.abs(lane) - 1) * 95;   // extra height for crowded lanes

  const tag = document.createElement("div");
  tag.className = "tag" + (inside ? " on-sun" : "") + (below ? " below" : "");
  tag.style.top = inside ? "50%" : below ? `calc(50% + ${offset}px)` : `calc(50% - ${offset}px)`;
  if (b.ink) { tag.style.setProperty("--inside-ink", b.ink); tag.style.setProperty("--inside-ink-dim", b.inkDim || b.ink); }

  const au = b.a / AU_KM;
  const line1 = b.note || `${au.toFixed(au >= 100 ? 0 : 2)} AU from the Sun`;
  const sizeText = b.d < 1
    ? `${(b.d * 1000).toFixed(b.d * 1000 < 10 ? 1 : 0)} m`
    : (b.d < 10 ? `${b.d}` : fmt(b.d)) + " km";
  let line2 = "";
  if (b.ghost) line2 = b.kind;
  else if (b.a) line2 = `${b.kind ? b.kind + ", " : ""}${b.est ? "about " : ""}${sizeText} wide`;
  const line3 = b.ghost ? ""
              : size < 0.001 ? `about 1/${fmt(1 / size)} of a pixel`
              : size < 1 ? `${size.toPrecision(2)} of a pixel`
              : b.name === "Mimas" ? "exactly 1 pixel" : "";
  const text = `<b>${b.name}</b><span>${line1}</span>` +
               (line2 ? `<span><br>${line2}</span>` : "") +
               (line3 ? `<span><br>${line3}</span>` : "") +
               (b.extra ? `<span><br>${b.extra}</span>` : "");
  const stem = inside ? "" : `<i class="stem"></i>`;
  tag.innerHTML = below ? stem + text : text + stem;
  add(tag, x, 220);

  /* Labels for the rings: below the planet, or (for the huge Phoebe ring) out on the ring itself */
  if (rs && rs.on) add(ringTag(rs.title || `${b.name}'s rings`, rs.label, `calc(50% + ${size / 2 + 14}px)`), x, 260);
  if (eo) {
    const top = eo.labelKm ? "calc(50% + 14px)" : `calc(50% + ${size / 2 + 14}px)`;
    (eo.labelKm ? [-1, 1] : [0]).forEach(sg => add(ringTag(eo.title, eo.label, top), x + sg * px(eo.labelKm), 260));
  }

  /* Magnetosphere label, out at the sun-facing edge (the magnetopause nose) */
  const mg = MAG.find(m => m.name === b.name);
  if (mg) {
    const lines = [
      `Sun-facing edge: about ${mg.mp} radii out (${fmtKm(mg.mpKm)}, ${fmt(px(mg.mpKm))} pixels)`,
      `Bow shock: about ${mg.bs} radii out (${fmtKm(mg.bsKm)})`
    ];
    if (mg.range) lines.push(`Pushed in and out by the solar wind: ${mg.range[0]} to ${mg.range[1]} radii`);
    lines.push(mg.tail);
    if (mg.extra) lines.push(mg.extra);
    const t = ringTag(`${b.name}'s magnetosphere`, lines, "calc(50% + 14px)");
    t.classList.add("maglabel");
    add(t, x - px(mg.mpKm), 300);

    /* Mark where the drawn magnetotail ends: a dashed line the full height of the screen, plus a label */
    const endLine = document.createElement("div");
    endLine.className = "tailend maglabel";
    add(endLine, x + mg.L, 5);
    const endTag = ringTag(mg.endTitle || "Edge of the known magnetotail",
      [`${b.name}'s tail, ${fmtKm(mg.tailKm)} from the planet (${fmt(mg.L)} pixels)`, mg.end],
      "calc(50% + 14px)");
    endTag.classList.add("maglabel");
    add(endTag, x + mg.L, 300);
  }

  /* Jump controls: planets get buttons, everything else gets a dropdown */
  if (b.moon) {
    if (!groups[b.parent]) {
      groups[b.parent] = document.createElement("optgroup");
      groups[b.parent].label = b.parent;
      moonMenu.appendChild(groups[b.parent]);
    }
    const opt = document.createElement("option");
    opt.value = x; opt.textContent = b.name;
    groups[b.parent].appendChild(opt);
  } else if (b.small) {
    const opt = document.createElement("option");
    opt.value = x; opt.textContent = b.name;
    smallMenu.appendChild(opt);
  } else if (b.hypo) {
    const opt = document.createElement("option");
    opt.value = x; opt.textContent = b.name;
    hypoMenu.appendChild(opt);
  } else if (b.far) {
    farOptions.push({ label: b.name, x });
  } else {
    const btn = document.createElement("button");
    btn.textContent = b.name;
    btn.onclick = () => goTo(x);
    nav.appendChild(btn);
  }
});

/* The far-reaches menu also lists the regions' starting edges, sorted by distance */
regions.forEach(r => {
  if (r.from >= 90 && r.menu !== false) farOptions.push({ label: r.name.split(":")[0].split(" (")[0], x: r.x0 });
});
farOptions.sort((p, q) => p.x - q.x).forEach(o => {
  const opt = document.createElement("option");
  opt.value = o.x; opt.textContent = o.label;
  farMenu.appendChild(opt);
});

const magMenu = makeMenu("Jump to a magnetosphere");
[["Sun-facing edge", m => m.x - px(m.mpKm), "magnetopause"],
 ["Tail end",        m => m.x + m.L,         "magnetotail end"]].forEach(([group, at, word]) => {
  const g = document.createElement("optgroup");
  g.label = group;
  MAG.forEach(m => {
    const opt = document.createElement("option");
    opt.value = at(m); opt.textContent = `${m.name}'s ${word}`;
    g.appendChild(opt);
  });
  magMenu.appendChild(g);
});

nav.appendChild(smallMenu);
nav.appendChild(moonMenu);
nav.appendChild(hypoMenu);
nav.appendChild(farMenu);
nav.appendChild(magMenu);

/* Ruler: every AU to 30, every 10 AU to 100, then wider steps, plus light-travel marks */
const TICKS = [];
for (let i = 1; i <= 30; i++) TICKS.push({ au: i, label: `${i} AU` });
for (let i = 40; i <= 100; i += 10) TICKS.push({ au: i, label: `${i} AU` });
[200, 300, 400, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000]
  .forEach(au => TICKS.push({ au, label: `${fmt(au)} AU` }));
TICKS.push({ au: C_KM_S * 86400 / AU_KM, label: "1 light-day", light: true });
for (let y = 1; y <= 4; y++) TICKS.push({ au: y * LY_AU, label: `${y} light-year${y > 1 ? "s" : ""}`, light: true });
TICKS.forEach(t => {
  const el = document.createElement("div");
  el.className = "tick" + (t.light ? " light" : "");
  el.innerHTML = `<i>${t.label}</i>`;
  add(el, xAU(t.au), 120);
});

/* ---------- Drawing ---------- */
const TILES = [413, 577, 701, 853];       // star-field tile widths (match background-size)

function span(s) {
  const y = s / 31557600;
  if (y >= 1) return `${y.toFixed(y >= 10 ? 1 : 2)} years`;
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  return d ? `${d} d ${h} h ${m} min` : h ? `${h} h ${m} min ${sec} s` : m ? `${m} min ${sec} s` : `${sec} s`;
}
function distText(km) {
  const au = km / AU_KM;
  if (au >= 5000) return `${(au / LY_AU).toFixed(3)} light-years (${fmt(au)} AU)`;
  const big = km >= 1e12 ? `${(km / 1e12).toFixed(2)} trillion km`
            : km >= 1e9  ? `${(km / 1e9).toFixed(1)} billion km`
            : `${(km / 1e6).toFixed(1)} million km`;
  return `${big} (${au.toFixed(au >= 100 ? 0 : 2)} AU)`;
}

/* Slider is linear: its full width covers the distance chosen in the dropdown */
const rangeSel = document.getElementById("range");
const sliderMax = () => rangeSel.value === "all"
  ? maxCam()
  : Math.min(maxCam(), xAU(Number(rangeSel.value)));
const sliderToCam = t => t * sliderMax();
const camToSlider = c => Math.min(1, c / sliderMax());
rangeSel.addEventListener("change", () => { dirty = true; });

function render() {
  const vw = stage.clientWidth;
  for (const it of items) {
    const sx = it.x - camLeft;
    const vis = sx > -it.hw && sx < vw + it.hw;
    if (vis !== it.vis) { it.el.style.display = vis ? "" : "none"; it.vis = vis; }
    if (vis) it.el.style.left = sx + "px";
  }
  drawMagnetospheres(vw, stage.clientHeight);
  for (const r of regions) {                      // clip each band to the screen (they can be billions of px wide)
    const s = Math.max(r.x0, camLeft), e = Math.min(r.x1, camLeft + vw);
    if (e > s) {
      r.el.style.display = "block";
      r.el.style.left = (s - camLeft) + "px";
      r.el.style.width = (e - s) + "px";
      r.el.style.borderLeft  = s === r.x0 ? "1px dashed rgba(233,230,220,.28)" : "none";
      r.el.style.borderRight = e === r.x1 ? "1px dashed rgba(233,230,220,.28)" : "none";
    } else r.el.style.display = "none";
  }
  stage.style.backgroundPosition = TILES.map(t => `${-(camLeft % t)}px 0`).join(",");

  const centre = camLeft + vw / 2;
  const km = Math.max(0, (centre - SUN_R) * KM_PER_PX);
  readout.innerHTML =
    `<em>Distance from the Sun:</em> ${distText(km)} &nbsp; <em>Light takes</em> ${span(km / C_KM_S)}`;

  scrub.value = String(camToSlider(camLeft) * 1000);
}

/* ---------- Input: wheel, drag, slider, keyboard, light-speed ---------- */
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaMode === 1 ? 33 : 1;
  setCam(camLeft + (e.deltaY + e.deltaX) * k * mult());
}, { passive: false });

let drag = null;
stage.addEventListener("pointerdown", e => {
  drag = { x: e.clientX, cam: camLeft };
  stage.setPointerCapture(e.pointerId);
  stage.classList.add("dragging");
});
stage.addEventListener("pointermove", e => {
  if (drag) setCam(drag.cam - (e.clientX - drag.x) * mult());
});
const endDrag = () => { drag = null; stage.classList.remove("dragging"); };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

scrub.addEventListener("input", () => setCam(sliderToCam(Number(scrub.value) / 1000)));
addEventListener("resize", () => setCam(camLeft));

const keys = new Set();
addEventListener("keydown", e => {
  if (e.target.closest("select, input")) return;           // leave menus and the slider alone
  if (["ArrowLeft", "ArrowRight"].includes(e.key)) { keys.add(e.key); e.preventDefault(); }
});
addEventListener("keyup", e => keys.delete(e.key));

const photonBtn = document.getElementById("photon");
let photon = false;
photonBtn.onclick = () => {
  photon = !photon;
  photonBtn.setAttribute("aria-pressed", photon);
};

let last = performance.now();
function frame(now) {
  const dt = (now - last) / 1000; last = now;
  let v = 0;
  if (keys.has("ArrowRight")) v += 600 * mult();
  if (keys.has("ArrowLeft"))  v -= 600 * mult();
  if (photon) v += LIGHT_PX_PER_S;            // exactly the speed of light at this scale (~756 px/s)
  if (v) setCam(camLeft + v * dt);
  if (dirty) { dirty = false; render(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
